name: Validate Texas Platform Core

on:
  push:
    branches: [main]
    paths:
      - 'packages/platform-core/**'
      - '.github/workflows/platform-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/platform-core/**'
      - '.github/workflows/platform-core.yml'
  schedule:
    - cron: '29 12 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texas-platform-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shared package release and boundaries
        run: node packages/platform-core/scripts/validate-package.mjs
      - name: Upload compatibility manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-platform-core-${{ github.run_id }}
          path: |
            packages/platform-core/release.json
            packages/platform-core/consumers.json
          retention-days: 90
