name: Validate Texas Platform Core

on:
  push:
    branches: [main]
    paths:
      - 'packages/platform-core/**'
      - '.github/workflows/platform-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/platform-core/**'
      - '.github/workflows/platform-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shared package boundaries
        run: node packages/platform-core/scripts/validate-package.mjs
